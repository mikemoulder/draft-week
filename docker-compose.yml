# FTL backend on the VPS: Postgres, the API, and the Strike ingest worker.
# Secrets come from ./.env (gitignored, chmod 600). See .env.example.
name: draftweek

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: draftweek
      POSTGRES_DB: draftweek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftweek -d draftweek"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  api:
    image: draftweek-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://draftweek:${POSTGRES_PASSWORD}@db:5432/draftweek
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      PORT: "3940"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3940:3940"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3940/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

  # Same image as the API. Starts once the API is healthy, so migrations have already run.
  ingest:
    image: draftweek-api
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://draftweek:${POSTGRES_PASSWORD}@db:5432/draftweek
      INGEST_INTERVAL_MS: "300000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m

volumes:
  db-data:
